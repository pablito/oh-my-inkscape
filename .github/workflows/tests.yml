name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y fontconfig fonts-liberation gettext
      - name: Python packages
        run: pip install lxml pytest
      - name: Tests (with the bundled fontTools)
        run: python -m pytest -q tests
      - name: Translations complete
        run: python tools/i18n.py --check
